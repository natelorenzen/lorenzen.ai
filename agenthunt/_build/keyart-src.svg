<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Source for agenthunt/assets/agenthunt-keyart.png (musecade/_build/pixelize.html, palette "agenthunt"). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb8ff"/>
      <stop offset=".7" stop-color="#cfe3ff"/>
      <stop offset="1" stop-color="#fff3dc"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset=".4" stop-color="#ffd76e"/>
      <stop offset="1" stop-color="#ffb627" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="660" cy="110" r="120" fill="url(#sun)"/>
  <circle cx="660" cy="110" r="44" fill="#ffd76e"/>
  <!-- clouds -->
  <g fill="#fffdf7"><rect x="90" y="80" width="120" height="20"/><rect x="110" y="64" width="70" height="20"/><rect x="380" y="120" width="100" height="18"/><rect x="398" y="106" width="56" height="16"/></g>

  <!-- far skyline -->
  <g fill="#a9c8ec">
    <rect x="0" y="250" width="70" height="200"/><rect x="70" y="210" width="50" height="240"/><rect x="120" y="270" width="60" height="180"/>
    <rect x="180" y="190" width="44" height="260"/><rect x="224" y="240" width="70" height="210"/><rect x="520" y="230" width="60" height="220"/>
    <rect x="580" y="180" width="50" height="270"/><rect x="630" y="250" width="80" height="200"/><rect x="710" y="210" width="90" height="240"/>
  </g>
  <!-- near buildings, warm -->
  <g>
    <rect x="0" y="300" width="160" height="200" fill="#ff8a72"/>
    <g fill="#fff3dc"><rect x="20" y="320" width="26" height="30"/><rect x="66" y="320" width="26" height="30"/><rect x="112" y="320" width="26" height="30"/><rect x="20" y="370" width="26" height="30"/><rect x="66" y="370" width="26" height="30"/><rect x="112" y="370" width="26" height="30"/></g>
    <rect x="0" y="300" width="160" height="10" fill="#b8333a"/>
    <!-- striped awning -->
    <g><rect x="0" y="420" width="160" height="22" fill="#fffdf7"/><rect x="0" y="420" width="20" height="22" fill="#ff5a4f"/><rect x="40" y="420" width="20" height="22" fill="#ff5a4f"/><rect x="80" y="420" width="20" height="22" fill="#ff5a4f"/><rect x="120" y="420" width="20" height="22" fill="#ff5a4f"/></g>
    <rect x="640" y="290" width="160" height="210" fill="#ffd76e"/>
    <g fill="#2f86f5"><rect x="660" y="312" width="26" height="30"/><rect x="706" y="312" width="26" height="30"/><rect x="752" y="312" width="26" height="30"/><rect x="660" y="362" width="26" height="30"/><rect x="706" y="362" width="26" height="30"/><rect x="752" y="362" width="26" height="30"/></g>
    <rect x="640" y="290" width="160" height="10" fill="#c77d00"/>
  </g>
  <!-- trees -->
  <g fill="#16945a"><circle cx="200" cy="430" r="34"/><circle cx="600" cy="430" r="34"/></g>
  <g fill="#5a3a22"><rect x="194" y="450" width="12" height="50"/><rect x="594" y="450" width="12" height="50"/></g>

  <!-- street and sidewalk -->
  <rect x="0" y="496" width="800" height="24" fill="#ead7b4"/>
  <rect x="0" y="520" width="800" height="80" fill="#6c6384"/>
  <g fill="#fff7e8"><rect x="40" y="556" width="70" height="8"/><rect x="190" y="556" width="70" height="8"/><rect x="540" y="556" width="70" height="8"/><rect x="690" y="556" width="70" height="8"/></g>

  <!-- THE FIND: a dog in sunglasses sitting next to a fire hydrant -->
  <g>
    <rect x="420" y="452" width="26" height="44" fill="#ff5a4f"/><rect x="414" y="446" width="38" height="10" fill="#b8333a"/><rect x="426" y="438" width="14" height="10" fill="#ff5a4f"/><rect x="408" y="468" width="50" height="8" fill="#b8333a"/>
    <!-- dog -->
    <rect x="340" y="456" width="56" height="40" fill="#c77d00"/>
    <rect x="356" y="420" width="40" height="40" fill="#ffb627"/>
    <rect x="352" y="414" width="12" height="18" fill="#c77d00"/><rect x="388" y="414" width="12" height="18" fill="#c77d00"/>
    <rect x="360" y="432" width="34" height="8" fill="#272140"/>
    <rect x="390" y="446" width="14" height="10" fill="#fff3dc"/><rect x="400" y="446" width="6" height="5" fill="#272140"/>
    <rect x="330" y="470" width="14" height="6" fill="#c77d00"/>
  </g>

  <!-- the phone, held up in the foreground, framing the find -->
  <g>
    <path fill-rule="evenodd" fill="#272140" d="M274 250 H526 Q550 250 550 274 V600 H250 V274 Q250 250 274 250 Z M266 270 V528 H534 V270 Z"/>
    <rect x="266" y="270" width="268" height="250" fill="none" stroke="#fffdf7" stroke-width="2" stroke-dasharray="6 6" opacity=".35"/>
    <!-- viewfinder corner brackets around the dog -->
    <g fill="#ffd76e">
      <rect x="320" y="400" width="34" height="6"/><rect x="320" y="400" width="6" height="34"/>
      <rect x="436" y="400" width="34" height="6"/><rect x="464" y="400" width="6" height="34"/>
      <rect x="320" y="494" width="34" height="6"/><rect x="320" y="466" width="6" height="34"/>
      <rect x="436" y="494" width="34" height="6"/><rect x="464" y="466" width="6" height="34"/>
    </g>
    <!-- shutter button -->
    <circle cx="400" cy="560" r="20" fill="#fffdf7"/><circle cx="400" cy="560" r="14" fill="#ff5a4f"/>
    <!-- hands -->
    <rect x="226" y="420" width="40" height="120" rx="16" fill="#d89a70"/>
    <rect x="534" y="420" width="40" height="120" rx="16" fill="#d89a70"/>
  </g>

  <!-- map pin floating above -->
  <g>
    <path d="M400 150 C372 150 356 170 356 192 C356 222 400 262 400 262 C400 262 444 222 444 192 C444 170 428 150 400 150 Z" fill="#ff5a4f"/>
    <circle cx="400" cy="192" r="16" fill="#fffdf7"/>
  </g>
  <!-- a little checkmark burst -->
  <g fill="#16945a"><rect x="480" y="190" width="10" height="10"/><rect x="490" y="200" width="10" height="10"/><rect x="500" y="190" width="10" height="10"/><rect x="510" y="180" width="10" height="10"/><rect x="520" y="170" width="10" height="10"/></g>
</svg>
