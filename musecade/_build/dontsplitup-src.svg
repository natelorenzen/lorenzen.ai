<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Source for musecade/assets/dontsplitup-keyart.png (pixelize.html, palette "dontsplitup"). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07050f"/>
      <stop offset=".45" stop-color="#1c1036"/>
      <stop offset=".75" stop-color="#3a2160"/>
      <stop offset="1" stop-color="#5a3a7a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2450"/>
      <stop offset="1" stop-color="#0a0814"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset=".55" stop-color="#cfe0ff"/>
      <stop offset=".75" stop-color="#8aa4e0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#3a2160" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".35" stop-color="#ff9a2a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="window" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e0801a"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fae8a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7fae8a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7fae8a" stop-opacity="0"/>
    </linearGradient>
    <filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#eef4ff"><rect x="60" y="40" width="3" height="3"/><rect x="190" y="90" width="3" height="3"/><rect x="330" y="30" width="3" height="3"/><rect x="430" y="120" width="3" height="3"/><rect x="740" y="60" width="3" height="3"/><rect x="120" y="170" width="3" height="3"/><rect x="270" y="150" width="2" height="2"/></g>

  <!-- the moon, big, upper right -->
  <circle cx="600" cy="130" r="150" fill="url(#moon)" filter="url(#b14)" opacity=".7"/>
  <circle cx="600" cy="130" r="78" fill="#e8f0ff"/>
  <circle cx="575" cy="110" r="14" fill="#c4d2f0"/><circle cx="625" cy="150" r="10" fill="#c4d2f0"/><circle cx="610" cy="100" r="7" fill="#c4d2f0"/>
  <!-- bats across the moon -->
  <g fill="#07050f">
    <path d="M560 120 l10 -6 l6 4 l6 -4 l10 6 l-8 0 l-8 5 l-8 -5 z"/>
    <path d="M630 80 l7 -4 l4 3 l4 -3 l7 4 l-6 0 l-5 3 l-5 -3 z"/>
  </g>

  <!-- far pine ridge -->
  <path d="M0 330 L20 300 L35 320 L55 280 L75 318 L95 290 L115 322 L140 286 L160 318 L185 296 L205 324 L230 290 L255 322 L280 300 L300 326 L520 330 L545 296 L565 322 L590 288 L612 320 L640 292 L660 324 L690 296 L712 322 L740 290 L765 320 L800 300 L800 360 L0 360 Z" fill="#160c28"/>
  <!-- the Patch on the far hill: tiny lights -->
  <g fill="#ff9a2a"><rect x="330" y="318" width="3" height="3"/><rect x="345" y="314" width="3" height="3"/><rect x="360" y="319" width="3" height="3"/><rect x="376" y="312" width="3" height="3"/><rect x="392" y="317" width="3" height="3"/><rect x="408" y="311" width="3" height="3"/><rect x="424" y="316" width="3" height="3"/><rect x="440" y="313" width="3" height="3"/><rect x="456" y="318" width="3" height="3"/><rect x="470" y="314" width="3" height="3"/><rect x="352" y="324" width="3" height="3"/><rect x="384" y="323" width="3" height="3"/><rect x="416" y="322" width="3" height="3"/><rect x="448" y="324" width="3" height="3"/></g>

  <!-- lake -->
  <rect x="0" y="356" width="800" height="90" fill="url(#lake)"/>
  <!-- moon reflection -->
  <g fill="#cfe0ff" opacity=".7"><rect x="570" y="366" width="60" height="3"/><rect x="580" y="378" width="40" height="3"/><rect x="565" y="392" width="70" height="3"/><rect x="585" y="406" width="30" height="3"/><rect x="575" y="420" width="50" height="2"/></g>
  <!-- cabin window reflection -->
  <g fill="#ffb14a" opacity=".6"><rect x="190" y="372" width="26" height="3"/><rect x="196" y="386" width="16" height="3"/><rect x="280" y="374" width="22" height="3"/></g>

  <!-- shore -->
  <path d="M0 430 Q200 410 400 428 T800 424 L800 600 L0 600 Z" fill="#0d0a18"/>

  <!-- the cabin, left of center -->
  <g>
    <path d="M120 400 L120 300 L250 230 L380 300 L380 400 Z" fill="#2a1a22"/>
    <path d="M104 306 L250 218 L396 306 L384 312 L250 232 L116 312 Z" fill="#160c14"/>
    <g stroke="#1a1018" stroke-width="3"><line x1="120" y1="330" x2="380" y2="330"/><line x1="120" y1="355" x2="380" y2="355"/><line x1="120" y1="380" x2="380" y2="380"/></g>
    <!-- chimney -->
    <rect x="320" y="230" width="26" height="50" fill="#2e2430"/>
    <!-- lit windows -->
    <rect x="160" y="320" width="62" height="50" fill="url(#window)"/>
    <rect x="280" y="320" width="62" height="50" fill="url(#window)"/>
    <rect x="232" y="258" width="34" height="30" fill="url(#window)"/>
    <g fill="#160c14"><rect x="189" y="320" width="4" height="50"/><rect x="160" y="343" width="62" height="4"/><rect x="309" y="320" width="4" height="50"/><rect x="280" y="343" width="62" height="4"/><rect x="247" y="258" width="4" height="30"/></g>
    <!-- silhouettes of the friends in the left window, pressed together -->
    <g fill="#1a0e1a">
      <circle cx="172" cy="352" r="7"/><rect x="164" y="358" width="16" height="12"/>
      <circle cx="186" cy="349" r="8"/><rect x="177" y="356" width="18" height="14"/>
      <circle cx="202" cy="351" r="7"/><rect x="194" y="357" width="16" height="13"/>
      <circle cx="214" cy="353" r="6"/><rect x="208" y="358" width="13" height="12"/>
    </g>
    <rect x="206" y="350" width="3" height="3" fill="#ff2a2a"/>
    <!-- door with 13 -->
    <rect x="232" y="336" width="36" height="64" fill="#160c14"/>
    <g fill="#c8a060"><rect x="243" y="344" width="3" height="10"/><rect x="249" y="344" width="7" height="3"/><rect x="253" y="347" width="3" height="3"/><rect x="249" y="350" width="7" height="2"/><rect x="253" y="352" width="3" height="3"/><rect x="249" y="355" width="7" height="2"/></g>
    <!-- porch -->
    <rect x="110" y="398" width="280" height="10" fill="#1e1218"/>
    <!-- porch pumpkins, glowing -->
    <circle cx="140" cy="390" r="26" fill="url(#glow)" filter="url(#b6)"/>
    <ellipse cx="140" cy="390" rx="12" ry="10" fill="#e0601a"/>
    <g fill="#ffe08a"><rect x="134" y="385" width="3" height="3"/><rect x="143" y="385" width="3" height="3"/><rect x="134" y="393" width="12" height="2"/></g>
    <circle cx="362" cy="390" r="26" fill="url(#glow)" filter="url(#b6)"/>
    <ellipse cx="362" cy="390" rx="12" ry="10" fill="#e0601a"/>
    <g fill="#ffe08a"><rect x="356" y="385" width="3" height="3"/><rect x="365" y="385" width="3" height="3"/><rect x="356" y="393" width="12" height="2"/></g>
  </g>

  <!-- near pines, left edge -->
  <path d="M0 600 L0 220 L18 260 L8 262 L30 310 L12 312 L40 370 L16 372 L50 440 L20 442 L60 520 L0 600 Z" fill="#07050c"/>
  <path d="M60 600 L80 380 L96 420 L86 422 L110 470 L92 472 L118 530 L100 532 L130 600 Z" fill="#07050c"/>

  <!-- ground fog -->
  <rect x="0" y="400" width="800" height="90" fill="url(#fog)"/>
  <rect x="0" y="470" width="800" height="70" fill="url(#fog)" opacity=".7"/>

  <!-- JACK HOLLOW, right foreground -->
  <g>
    <!-- lantern glow on the ground -->
    <ellipse cx="540" cy="575" rx="120" ry="24" fill="#ff8a2a" opacity=".25" filter="url(#b6)"/>
    <!-- legs -->
    <path d="M588 600 L596 470 L612 470 L606 600 Z" fill="#1a1010"/>
    <path d="M628 600 L626 470 L644 470 L650 600 Z" fill="#160c0c"/>
    <!-- coat -->
    <path d="M568 500 L578 330 L600 312 L652 312 L672 330 L684 500 L650 488 L626 506 L600 488 Z" fill="#3a2418"/>
    <path d="M626 322 L626 500" stroke="#24160e" stroke-width="4"/>
    <path d="M578 330 L600 312 L626 340 L652 312 L672 330" stroke="#24160e" stroke-width="5" fill="none"/>
    <!-- straw at the cuffs and hem -->
    <g stroke="#d8b050" stroke-width="3"><line x1="574" y1="496" x2="566" y2="512"/><line x1="582" y1="498" x2="580" y2="514"/><line x1="676" y1="496" x2="686" y2="512"/><line x1="668" y1="498" x2="672" y2="514"/></g>
    <!-- left arm holding lantern out -->
    <path d="M582 340 L536 420 L548 428 L594 352 Z" fill="#3a2418"/>
    <g stroke="#d8b050" stroke-width="3"><line x1="538" y1="424" x2="528" y2="434"/><line x1="544" y1="428" x2="540" y2="440"/></g>
    <line x1="536" y1="430" x2="536" y2="448" stroke="#2e2430" stroke-width="3"/>
    <circle cx="536" cy="470" r="40" fill="url(#glow)" filter="url(#b6)"/>
    <rect x="524" y="448" width="24" height="34" fill="#2e2430"/>
    <rect x="528" y="452" width="16" height="26" fill="#ffd27a"/>
    <rect x="534" y="458" width="4" height="12" fill="#fff4c8"/>
    <!-- right arm with sickle held low -->
    <path d="M668 336 L706 430 L694 436 L656 348 Z" fill="#3a2418"/>
    <line x1="700" y1="432" x2="712" y2="500" stroke="#4a3018" stroke-width="5"/>
    <path d="M712 500 Q760 492 756 452 Q748 482 712 488 Z" fill="#8a8a9a"/>
    <!-- the pumpkin head -->
    <circle cx="626" cy="268" r="70" fill="url(#glow)" filter="url(#b14)" opacity=".8"/>
    <ellipse cx="626" cy="272" rx="50" ry="42" fill="#e0601a"/>
    <path d="M598 236 Q590 272 600 306" stroke="#a83a12" stroke-width="4" fill="none"/>
    <path d="M654 236 Q662 272 652 306" stroke="#a83a12" stroke-width="4" fill="none"/>
    <path d="M626 232 L626 312" stroke="#a83a12" stroke-width="3"/>
    <rect x="620" y="218" width="10" height="16" fill="#3a5a20"/>
    <!-- carved face, lit from within -->
    <path d="M598 260 L612 246 L618 266 Z" fill="#ffe08a"/>
    <path d="M654 260 L640 246 L634 266 Z" fill="#ffe08a"/>
    <path d="M622 270 L626 262 L630 270 Z" fill="#ffe08a"/>
    <path d="M594 282 Q626 316 658 282 L648 284 L644 292 L636 286 L630 296 L622 286 L616 296 L608 286 L604 292 Z" fill="#fff4c8"/>
  </g>
</svg>
