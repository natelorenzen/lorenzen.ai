  </g>
  <g filter="url(#blur2)">
    <path d="M566 250 L558 272 L566 286 L552 308 L560 326" fill="none" stroke="#9fe8ff" stroke-width="2.2"/>
    <path d="M592 290 L600 306 L594 318" fill="none" stroke="#9fe8ff" stroke-width="1.6"/>
  </g>
  <circle cx="562" cy="296" r="56" fill="url(#hushglow)" opacity=".8"/>

