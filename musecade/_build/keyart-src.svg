<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">The Black Road</title>
  <desc id="d">A lone cloaked courier stands on a black stone road that winds toward a cliff monastery, beneath a black new-moon eclipse crowned with fire. Pale blue ghostly figures wait in the fog.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040208"/>
      <stop offset=".18" stop-color="#12081b"/>
      <stop offset=".33" stop-color="#3d0c24"/>
      <stop offset=".42" stop-color="#8e1a24"/>
      <stop offset=".49" stop-color="#d8501a"/>
      <stop offset=".54" stop-color="#ffae45"/>
      <stop offset=".6" stop-color="#ffd98a"/></linearGradient>
    <radialGradient id="corona" cx="400" cy="190" r="190" gradientUnits="userSpaceOnUse">
      <stop offset=".36" stop-color="#fff1c4" stop-opacity="1"/>
      <stop offset=".42" stop-color="#ffb347" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#e0561a" stop-opacity=".55"/>
      <stop offset=".75" stop-color="#9b1f23" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9b1f23" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="boxglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0b8" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#ffb347" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#e0561a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#e0561a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hushglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#bff2ff" stop-opacity=".75"/>
      <stop offset=".4" stop-color="#34c6ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#34c6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset=".5" stop-color="#e0561a" stop-opacity=".2"/>
      <stop offset="1" stop-color="#e0561a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roadwet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9b1f23" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="vignette" cx="400" cy="300" r="520" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .22"/></feComponentTransfer>
    </filter>
    <pattern id="rain" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <line x1="6" y1="0" x2="6" y2="14" stroke="#ffe6c2" stroke-opacity=".16" stroke-width="1"/>
      <line x1="26" y1="18" x2="26" y2="28" stroke="#ffe6c2" stroke-opacity=".1" stroke-width="1"/>
      <line x1="16" y1="30" x2="16" y2="40" stroke="#bfe9ff" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>

