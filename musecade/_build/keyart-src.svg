  <g transform="translate(352 574) scale(1.28) translate(-352 -574)">
    <ellipse cx="352" cy="574" rx="54" ry="8" fill="#000" opacity=".6"/>
    <path d="M340 382 C326 382 320 396 321 410 C322 420 326 426 321 433 C302 441 294 460 291 486 C287 520 276 548 260 574 L298 570 L310 580 L326 570 L340 582 L354 570 L374 576 L390 562 C416 566 440 558 462 540 C438 540 416 530 404 512 C398 482 386 452 364 436 C358 430 356 422 357 410 C358 394 352 382 340 382 Z" fill="#040206"/>
    <path d="M340 382 C326 382 320 396 321 410 C322 420 326 426 321 433 C302 441 294 460 291 486 C287 520 276 548 260 574" fill="none" stroke="url(#rimL)" stroke-width="2.5" opacity=".9"/>
    <path d="M340 382 C352 382 358 394 357 410 C356 422 358 430 364 436 C386 452 398 482 404 512 C416 530 438 540 462 540" fill="none" stroke="#ffb347" stroke-opacity=".35" stroke-width="1.5"/>
    <path d="M314 480 L286 560 L282 572 L292 566 L318 484 Z" fill="#040206"/>
    <path d="M314 480 L318 484" stroke="#ffcf6b" stroke-width="2" opacity=".6"/>
    <circle cx="0" cy="0" r="1" fill="url(#boxglow)" transform="translate(378 470) scale(70)"/>
    <path d="M368 462 L388 458 L390 472 L370 476 Z" fill="#ffb347" opacity=".35"/>
  </g>

