  <path d="M560 600 C460 574 396 548 414 520 C426 500 400 490 410 474 C418 462 452 456 462 441" fill="none" stroke="url(#roadwet)" stroke-width="2"/>
  <g stroke="#ff9a3c" stroke-opacity=".22" stroke-width="1.2" fill="none">
