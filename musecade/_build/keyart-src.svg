  <!-- fog bank -->
  <g filter="url(#blur14)" opacity=".5">
    <ellipse cx="160" cy="470" rx="220" ry="26" fill="#6b5a88"/>
    <ellipse cx="640" cy="462" rx="230" ry="24" fill="#5b6b92"/>
    <ellipse cx="420" cy="486" rx="260" ry="18" fill="#7a5f7c"/>
