<!doctype html>
<!--
  Musecade pixel-art converter (build tool, not published: _build/ is ignored by Jekyll).
  Renders an SVG scene at arcade resolution, applies a vignette, quantizes to the
  Musecade palette with 4x4 Bayer ordered dithering, and adds pixel rain.
  Open via a local server:  python3 -m http.server  ->  /musecade/_build/pixelize.html
  Then call window.pixelize() in the console; it returns a PNG data URL and shows the result.
  The published key art (assets/blackroad-keyart.png) was made with the defaults: 256x192, spread 22.
-->
<meta charset="utf-8">
<title>pixelize</title>
<body style="background:#111;margin:0">
<canvas id="out" style="image-rendering:pixelated;width:960px;height:720px"></canvas>
<script>
const PALETTE = [
  "#040306","#0b0610","#140a18","#1d0e22","#2a1430","#3a1a3c",
  "#3d0c24","#5e0f1c","#8e1a24","#b3261e","#d7263d","#e0561a",
  "#ff8a2a","#ffae45","#ffd27a","#fff1c4",
  "#6b5a88","#4b3f66","#2d2a4a","#7a5f7c",
  "#0d3a52","#1f6f94","#36c8ff","#9fe8ff","#e6fbff",
  "#3a2a1a","#7d5b1e","#d9ab43","#9a8d78","#5f5549"
].map(h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16)));

const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

function nearest(r, g, b) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < PALETTE.length; i++) {
    const [pr, pg, pb] = PALETTE[i];
    const dr = r - pr, dg = g - pg, db = b - pb;
    const d = dr * dr * .3 + dg * dg * .59 + db * db * .11;
    if (d < bd) { bd = d; best = i; }
  }
  return PALETTE[best];
}

function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }

window.pixelize = async function (src = "keyart-src.svg", W = 256, H = 192, spread = 22) {
  const img = new Image();
  img.src = src;
  await img.decode();
  const c = document.getElementById("out");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(img, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H);
  const px = data.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2);
      const v = Math.max(0, 1 - Math.max(0, Math.hypot(dx, dy) - .72) * 1.1); // vignette
      const t = (BAYER[y % 4][x % 4] / 16 - .5) * spread;
      const [r, g, b] = nearest(px[i] * v + t, px[i + 1] * v + t, px[i + 2] * v + t);
      px[i] = r; px[i + 1] = g; px[i + 2] = b; px[i + 3] = 255;
    }
  }
  // pixel rain: short diagonal streaks, brighter over dark sky
  const rand = rng(317);
  for (let n = 0; n < 150; n++) {
    const x0 = Math.floor(rand() * W), y0 = Math.floor(rand() * H * .95), len = 2 + Math.floor(rand() * 3);
    for (let k = 0; k < len; k++) {
      const x = x0 - Math.floor(k / 2), y = y0 + k;
      if (x < 0 || y >= H) continue;
      const i = (y * W + x) * 4;
      const lum = px[i] * .3 + px[i + 1] * .59 + px[i + 2] * .11;
      const col = lum < 60 ? PALETTE[17] : PALETTE[16];
      px[i] = col[0]; px[i + 1] = col[1]; px[i + 2] = col[2];
    }
  }
  ctx.putImageData(data, 0, 0);
  return c.toDataURL("image/png");
};
</script>
</body>
