<!doctype html>
<!--
  Musecade pixel-art converter (build tool, not published: _build/ is ignored by Jekyll).
  Renders an SVG scene at arcade resolution, applies a vignette, quantizes to the
  Musecade palette with 4x4 Bayer ordered dithering, and adds pixel rain.
  Open via a local server:  python3 -m http.server  ->  /musecade/_build/pixelize.html
  Then call window.pixelize() in the console; it returns a PNG data URL and shows the result.
  Published key art: blackroad-keyart.png = pixelize("keyart-src.svg"); glasscity-keyart.png =
  pixelize("glasscity-src.svg", 256, 192, 22, "theglasscity"). Add a palette per game.
-->
<meta charset="utf-8">
<title>pixelize</title>
<body style="background:#111;margin:0">
<canvas id="out" style="image-rendering:pixelated;width:960px;height:720px"></canvas>
<script>
const HEX = (list) => list.map(h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16)));
const PALETTES = {
  theblackroad: HEX([
    "#040306","#0b0610","#140a18","#1d0e22","#2a1430","#3a1a3c",
    "#3d0c24","#5e0f1c","#8e1a24","#b3261e","#d7263d","#e0561a",
    "#ff8a2a","#ffae45","#ffd27a","#fff1c4",
    "#6b5a88","#4b3f66","#2d2a4a","#7a5f7c",
    "#0d3a52","#1f6f94","#36c8ff","#9fe8ff","#e6fbff",
    "#3a2a1a","#7d5b1e","#d9ab43","#9a8d78","#5f5549"]),
  theglasscity: HEX([
    "#03050a","#070b16","#0c1424","#132036","#1b2d4a","#26405f",
    "#34587a","#4a7898","#6ea2bd","#9fd0e0","#d4f1f7",
    "#0f3a3a","#1d5a55","#2f8078","#5fb3a2",
    "#3a1c0c","#6e3512","#b85a14","#f08a24","#ffb347","#ffd98a","#fff3d6",
    "#5e0f1c","#9e1b2a","#d7263d",
    "#1a1a1e","#3a3a42","#6a6a74","#a8a8b0","#e8e8ea"]),
};
PALETTES.theseaglassinn = HEX([
    "#0b1020","#16213e","#23345c","#2f4a7a","#3f6aa0","#6b98c6","#a9c8e6","#e4f0fa",
    "#1f4a4a","#2e6e66","#4f9c86","#8cc7ae",
    "#5b2b3a","#9c4a5a","#d97b7b","#f0a98a","#f7cf9a","#fff0cf",
    "#6e4a1c","#b27a2c","#e0a847","#f2d27a",
    "#4b3a6e","#8a6bb8","#1f3fa8","#b3262e",
    "#2a2622","#5a5048","#9a8e80","#d8cfc2",
    "#070b18","#0d1428","#1a2238","#e8622c","#ff9a3c","#3f8ee0","#241a18","#5a3a22"]);
PALETTES.seriesdoom = HEX([
    "#07060f","#130f2a","#221a47","#3a2a6e","#5b3f9a","#8a5fd0",
    "#1a2a44","#2f4d73","#5f86b0","#a9c4de","#e8f1fa",
    "#c0362c","#e05a2a","#ff8a3d","#ffb65c","#ffe08a",
    "#ff4fa3","#ff9ed0","#2ee6ff","#9ff6ff",
    "#6b5a2a","#b89a4a","#e6cf7a",
    "#1d1d22","#3a3a44","#6c6c7a","#b4b4c0","#f4f4f8",
    "#2f7d3a","#7fd07a"]);
PALETTES.ghostline = HEX([
    "#07050d","#0a0714","#120c22","#1a1030","#241e38","#2a2440","#3a2a5e","#4a1a44",
    "#ff3fa4","#ff8ac8","#ffd1ea","#2ef2ff","#9ff6ff","#e8f9ff","#9bff4f","#d6ff9e",
    "#e0302a","#ff6a3d","#ffe08a","#f7d38a","#fff3c4",
    "#1c1630","#0f0c18","#1a1216","#6a78b8","#3a3a5a","#6a6a8a","#b8b0d0","#c8d0f0","#e8e4f4"]);
PALETTES.dontsplitup = HEX([
    "#07050c","#0d0a18","#160c28","#1c1036","#2a2450","#3a2160","#5a3a7a","#8a6ab0",
    "#a83a12","#e0601a","#ff8a2a","#ffb14a","#ffd27a","#ffe08a","#fff4c8",
    "#2a1a22","#3a2418","#1a1010","#4a3018","#d8b050",
    "#8aa4e0","#c4d2f0","#e8f0ff",
    "#3a5a20","#7fae8a","#b8d8b0",
    "#ff2a2a","#2e2430","#5a5a6a","#8a8a9a"]);
PALETTES.blackfriday = HEX([
    "#0a0a14","#0d0a18","#14121e","#22182a","#2a1640","#2a2440","#3a3a5a","#c04a7a",
    "#101418","#0a2a1a","#2a8a4a","#7dff9a","#2a0e14","#ff4a4a","#e0302a",
    "#0e1a3a","#1a3a8a","#5aa8ff","#4af2ff","#8a5aff","#ff4fa3","#ff8ad0",
    "#ffd24a","#ffc83a","#ffe08a","#ff8a2a","#b07a3a","#d8b070","#3a2418","#d89a70","#e8e4f0"]);
PALETTES.agenthunt = HEX([
    "#fff7e8","#fffdf7","#fff3dc","#ead7b4","#d8bf92","#cfe3ff","#a9c8ec","#7cb8ff","#2f86f5",
    "#ffd76e","#ffb627","#c77d00","#ff8a72","#ff5a4f","#b8333a",
    "#16945a","#5a3a22","#d89a70","#6c6384","#272140","#2f2947"]);
PALETTES.montecristo = HEX([
    "#060a1c","#0e0c14","#070c1e","#16244a","#1c3462","#2c4a7a","#3a5a92","#3a4a7a","#8a9cc8",
    "#cfd2dc","#d8dcea","#ece8d8","#f4f2e6","#e8e4d4",
    "#14141e","#1a1a26","#2a2c3a","#3a3c4e","#4a4c60",
    "#5a3418","#6a4020","#c07a10","#ffc840","#ffd84a","#fff2b0",
    "#e0304a","#2ab070","#122a1e","#d8c8b8","#3a2a1a"]);
let PALETTE = PALETTES.theblackroad;

const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

function nearest(r, g, b) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < PALETTE.length; i++) {
    const [pr, pg, pb] = PALETTE[i];
    const dr = r - pr, dg = g - pg, db = b - pb;
    const d = dr * dr * .3 + dg * dg * .59 + db * db * .11;
    if (d < bd) { bd = d; best = i; }
  }
  return PALETTE[best];
}

function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }

window.pixelize = async function (src = "keyart-src.svg", W = 256, H = 192, spread = 22, palette = "theblackroad") {
  PALETTE = PALETTES[palette];
  const img = new Image();
  img.src = src;
  await img.decode();
  const c = document.getElementById("out");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(img, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H);
  const px = data.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2);
      const v = Math.max(0, 1 - Math.max(0, Math.hypot(dx, dy) - .72) * 1.1); // vignette
      const t = (BAYER[y % 4][x % 4] / 16 - .5) * spread;
      const [r, g, b] = nearest(px[i] * v + t, px[i + 1] * v + t, px[i + 2] * v + t);
      px[i] = r; px[i + 1] = g; px[i + 2] = b; px[i + 3] = 255;
    }
  }
  // pixel rain: short diagonal streaks, brighter over dark sky
  const rand = rng(317);
  for (let n = 0; n < (palette === "theseaglassinn" || palette === "seriesdoom" || palette === "dontsplitup" || palette === "blackfriday" || palette === "agenthunt" || palette === "montecristo" ? 0 : 150); n++) {
    const x0 = Math.floor(rand() * W), y0 = Math.floor(rand() * H * .95), len = 2 + Math.floor(rand() * 3);
    for (let k = 0; k < len; k++) {
      const x = x0 - Math.floor(k / 2), y = y0 + k;
      if (x < 0 || y >= H) continue;
      const i = (y * W + x) * 4;
      const lum = px[i] * .3 + px[i + 1] * .59 + px[i + 2] * .11;
      const rainIdx = { theblackroad: [17, 16], theglasscity: [6, 8], theseaglassinn: [5, 6], seriesdoom: [3, 4], ghostline: [24, 26], dontsplitup: [4, 6], blackfriday: [5, 6], agenthunt: [6, 7], montecristo: [4, 6] }[palette];
      const col = lum < 60 ? PALETTE[rainIdx[0]] : PALETTE[rainIdx[1]];
      px[i] = col[0]; px[i + 1] = col[1]; px[i + 2] = col[2];
    }
  }
  ctx.putImageData(data, 0, 0);
  return c.toDataURL("image/png");
};
</script>
</body>
