<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Source for musecade/assets/seaglass-keyart.png (pixelize.html, palette "theseaglassinn"). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23345c"/>
      <stop offset=".3" stop-color="#6b98c6"/>
      <stop offset=".52" stop-color="#f0a98a"/>
      <stop offset=".62" stop-color="#f7cf9a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b98c6"/>
      <stop offset=".5" stop-color="#2f4a7a"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0cf"/>
      <stop offset=".4" stop-color="#f7cf9a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f0a98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a9c8e6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#3f6aa0" stop-opacity="0"/>
    </radialGradient>
    <filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="300" cy="318" r="120" fill="url(#sun)"/>
  <circle cx="300" cy="318" r="30" fill="#fff0cf"/>
  <g filter="url(#b6)" opacity=".7"><ellipse cx="160" cy="150" rx="140" ry="16" fill="#d97b7b"/><ellipse cx="560" cy="110" rx="170" ry="18" fill="#f0a98a"/><ellipse cx="420" cy="230" rx="120" ry="10" fill="#f7cf9a"/></g>
  <!-- gulls -->
  <g stroke="#2a2622" stroke-width="3" fill="none"><path d="M420 150 q8 -8 16 0 q8 -8 16 0"/><path d="M480 180 q6 -6 12 0 q6 -6 12 0"/><path d="M200 210 q5 -5 10 0 q5 -5 10 0"/></g>

  <!-- sea -->
  <rect y="330" width="800" height="270" fill="url(#sea)"/>
  <g fill="#f7cf9a" opacity=".85"><rect x="250" y="340" width="100" height="4"/><rect x="265" y="356" width="70" height="3"/><rect x="280" y="372" width="40" height="3"/><rect x="220" y="388" width="60" height="2"/><rect x="330" y="392" width="30" height="2"/></g>
  <g fill="#a9c8e6" opacity=".5"><rect x="480" y="400" width="60" height="2"/><rect x="100" y="420" width="50" height="2"/><rect x="600" y="440" width="40" height="2"/></g>

  <!-- the point and the dark lighthouse (left) -->
  <path d="M0 340 L0 320 L60 312 L120 322 L150 334 L160 342 Z" fill="#2a2622"/>
  <rect x="80" y="232" width="18" height="84" fill="#d8cfc2"/>
  <rect x="80" y="262" width="18" height="10" fill="#b3262e"/>
  <rect x="80" y="290" width="18" height="10" fill="#b3262e"/>
  <rect x="77" y="222" width="24" height="12" fill="#2a2622"/>
  <rect x="82" y="214" width="14" height="8" fill="#5a5048"/>
  <polygon points="89,206 80,214 98,214" fill="#2a2622"/>

  <!-- the bluff and the inn (right) -->
  <path d="M520 340 L560 250 L800 230 L800 600 L600 600 Z" fill="#2e6e66"/>
  <path d="M520 340 L560 250 L600 248" stroke="#8cc7ae" stroke-width="3" fill="none"/>
  <path d="M540 360 L580 290 L620 300 L600 380 Z" fill="#5a5048"/>
  <path d="M600 600 L560 420 L640 360 L800 350 L800 600 Z" fill="#1f4a4a"/>
  <!-- inn body -->
  <rect x="610" y="150" width="150" height="100" fill="#d8cfc2"/>
  <rect x="610" y="150" width="150" height="100" fill="none" stroke="#9a8e80" stroke-width="2"/>
  <polygon points="600,152 685,98 770,152" fill="#5b2b3a"/>
  <rect x="660" y="72" width="50" height="30" fill="#d8cfc2"/>
  <rect x="656" y="66" width="58" height="8" fill="#2a2622"/>
  <circle cx="685" cy="87" r="9" fill="#e0a847"/>
  <rect x="740" y="112" width="10" height="36" fill="#9a8e80"/>
  <g fill="#f2d27a"><rect x="624" y="170" width="16" height="20"/><rect x="654" y="170" width="16" height="20"/><rect x="700" y="170" width="16" height="20"/><rect x="730" y="170" width="16" height="20"/><rect x="624" y="210" width="16" height="20"/><rect x="730" y="210" width="16" height="20"/></g>
  <rect x="676" y="212" width="20" height="38" fill="#6e4a1c"/>
  <rect x="600" y="248" width="170" height="6" fill="#9a8e80"/>

  <!-- foreground beach and rocks -->
  <path d="M0 480 C150 460 300 470 420 490 C520 505 560 520 600 600 L0 600 Z" fill="#d8cfc2"/>
  <path d="M0 480 C150 460 300 470 420 490 C520 505 560 520 600 600" stroke="#fff0cf" stroke-width="3" fill="none"/>
  <path d="M30 520 L90 506 L120 530 L70 546 Z" fill="#5a5048"/>
  <path d="M440 540 L520 520 L560 560 L480 580 Z" fill="#5a5048"/>
  <!-- scattered sea glass -->
  <g>
    <rect x="160" y="540" width="8" height="6" fill="#1f3fa8"/><rect x="200" y="560" width="8" height="6" fill="#4f9c86"/>
    <rect x="240" y="530" width="8" height="6" fill="#e0a847"/><rect x="330" y="552" width="8" height="6" fill="#b3262e"/>
    <rect x="370" y="534" width="8" height="6" fill="#8a6bb8"/><rect x="280" y="576" width="8" height="6" fill="#e4f0fa"/>
    <rect x="120" y="566" width="8" height="6" fill="#8cc7ae"/><rect x="410" y="566" width="8" height="6" fill="#f2d27a"/>
  </g>

  <!-- the player: a woman in a long coat and scarf, holding sea glass up to the sun -->
  <ellipse cx="300" cy="520" rx="36" ry="5" fill="#2a2622" opacity=".35"/>
  <path d="M288 430 C282 432 278 440 280 448 L272 520 L292 520 L298 478 L304 520 L324 520 L318 448 C320 440 316 432 310 430 Z" fill="#2f4a7a"/>
  <rect x="289" y="428" width="22" height="8" fill="#b3262e"/>
  <circle cx="300" cy="418" r="11" fill="#f0a98a"/>
  <path d="M288 414 C288 400 312 400 312 414 L312 426 C306 420 294 420 288 426 Z" fill="#6e4a1c"/>
  <path d="M312 440 L334 404" stroke="#2f4a7a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="336" cy="398" r="26" fill="url(#glow)"/>
  <rect x="332" y="394" width="8" height="8" fill="#1f3fa8"/>
  <rect x="334" y="395" width="3" height="3" fill="#a9c8e6"/>
</svg>
