<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Source for musecade/assets/seaglass-keyart.png (pixelize.html, palette "theseaglassinn"). v2: the teen thriller. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset=".55" stop-color="#16213e"/>
      <stop offset=".72" stop-color="#23345c"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4c"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="fire" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#e8622c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5b2b3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e4f0fa"/>
      <stop offset=".3" stop-color="#3f8ee0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#1f3fa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0cf"/>
      <stop offset=".4" stop-color="#f2d27a" stop-opacity=".6"/>
      <stop offset="1" stop-color="#f2d27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f7e2a8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#f7e2a8" stop-opacity="0"/>
    </linearGradient>
    <filter id="b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- night sky and stars (new moon: no moon) -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <g fill="#e4f0fa">
    <rect x="40" y="40" width="3" height="3"/><rect x="120" y="90" width="2" height="2"/><rect x="200" y="30" width="3" height="3"/>
    <rect x="260" y="120" width="2" height="2"/><rect x="330" y="60" width="3" height="3"/><rect x="410" y="25" width="2" height="2"/>
    <rect x="470" y="100" width="3" height="3"/><rect x="540" y="50" width="2" height="2"/><rect x="600" y="130" width="2" height="2"/>
    <rect x="660" y="35" width="3" height="3"/><rect x="740" y="80" width="2" height="2"/><rect x="90" y="170" width="2" height="2"/>
    <rect x="380" y="150" width="2" height="2"/><rect x="720" y="170" width="2" height="2"/><rect x="160" y="210" width="2" height="2"/>
  </g>
  <g filter="url(#b10)" opacity=".35"><ellipse cx="420" cy="140" rx="260" ry="30" fill="#4b3a6e"/></g>

  <!-- sea -->
  <rect x="0" y="330" width="800" height="270" fill="url(#sea)"/>
  <g stroke="#2f4a7a" stroke-width="3" opacity=".8">
    <line x1="40" y1="360" x2="120" y2="360"/><line x1="300" y1="372" x2="380" y2="372"/><line x1="200" y1="395" x2="250" y2="395"/>
    <line x1="430" y1="390" x2="470" y2="390"/><line x1="60" y1="420" x2="110" y2="420"/>
  </g>

  <!-- Gull Rock: islet, roofless cottage, one warm light -->
  <path d="M430 338 Q470 300 520 312 Q560 305 590 336 Z" fill="#0d1428"/>
  <rect x="478" y="296" width="48" height="26" fill="#1a2238"/>
  <path d="M474 298 L490 284 L512 286 L530 298 Z" fill="#141b30"/>
  <rect x="496" y="306" width="7" height="8" fill="#f2d27a"/>
  <circle cx="500" cy="310" r="18" fill="url(#lamp)" opacity=".7"/>
  <!-- causeway rocks -->
  <g fill="#0d1428"><ellipse cx="600" cy="342" rx="14" ry="5"/><ellipse cx="625" cy="346" rx="12" ry="5"/><ellipse cx="650" cy="342" rx="12" ry="4"/></g>

  <!-- the point and the dead lighthouse -->
  <path d="M600 600 L610 380 Q650 340 700 330 Q760 330 800 350 L800 600 Z" fill="#0a0f1e"/>
  <path d="M680 336 L690 170 L722 170 L732 336 Z" fill="#d8cfc2"/>
  <path d="M686 250 L726 250 L728 270 L684 270 Z" fill="#9c4a5a"/>
  <path d="M684 300 L728 300 L730 320 L682 320 Z" fill="#9c4a5a"/>
  <rect x="684" y="150" width="44" height="22" fill="#1a2238"/>
  <path d="M680 150 L706 128 L732 150 Z" fill="#2a2622"/>
  <rect x="678" y="170" width="56" height="5" fill="#2a2622"/>
  <!-- flashlight in the lamp room, beam sweeping toward the beach -->
  <circle cx="700" cy="160" r="5" fill="#fff0cf"/>
  <circle cx="700" cy="160" r="22" fill="url(#lamp)"/>
  <path d="M700 157 L360 250 L380 290 L700 163 Z" fill="url(#beam)" opacity=".7"/>

  <!-- beach and bonfire, left -->
  <path d="M0 600 L0 430 Q120 400 260 418 Q380 440 460 520 L470 600 Z" fill="#2a2622"/>
  <path d="M0 440 Q120 412 260 428 Q360 444 420 490" stroke="#5a5048" stroke-width="4" fill="none"/>
  <circle cx="170" cy="400" r="120" fill="url(#fire)"/>
  <path d="M140 420 L170 340 L182 380 L196 350 L204 422 Z" fill="#e8622c"/>
  <path d="M154 420 L172 366 L184 398 L192 380 L196 422 Z" fill="#ffd27a"/>
  <rect x="136" y="418" width="72" height="8" fill="#5a3a22"/>
  <g fill="#ffd27a"><rect x="160" y="320" width="3" height="3"/><rect x="186" y="300" width="3" height="3"/><rect x="176" y="280" width="2" height="2"/><rect x="198" y="330" width="2" height="2"/></g>
  <!-- tiny silhouettes around the fire -->
  <g fill="#0b0a12">
    <rect x="90" y="394" width="10" height="30"/><circle cx="95" cy="388" r="6"/>
    <rect x="232" y="398" width="10" height="28"/><circle cx="237" cy="392" r="6"/>
    <rect x="254" y="402" width="9" height="24"/><circle cx="258" cy="396" r="5"/>
    <rect x="60" y="404" width="9" height="24"/><circle cx="64" cy="398" r="5"/>
  </g>

  <!-- the girl: foreground, from behind, hoodie, ponytail, hand raised with glowing blue sea glass -->
  <g>
    <path d="M330 600 L346 470 Q360 440 392 436 Q424 440 438 470 L454 600 Z" fill="#141a2e"/>
    <path d="M346 470 Q360 440 392 436 Q424 440 438 470 L430 490 Q392 470 354 490 Z" fill="#1d2640"/>
    <circle cx="392" cy="412" r="28" fill="#1a1414"/>
    <path d="M346 470 Q356 446 380 438" stroke="#e8622c" stroke-width="5" fill="none"/>
    <path d="M366 404 Q370 390 384 385" stroke="#b86a3a" stroke-width="4" fill="none"/>
    <path d="M342 500 L334 600" stroke="#5b2b3a" stroke-width="5"/>
    <path d="M404 404 Q430 420 420 468 Q412 440 400 426 Z" fill="#241a18"/>
    <path d="M430 480 Q470 450 488 404 L500 410 Q486 462 440 500 Z" fill="#141a2e"/>
    <circle cx="496" cy="398" r="11" fill="#0f0f16"/>
    <circle cx="500" cy="386" r="40" fill="url(#glass)"/>
    <path d="M492 378 L506 374 L512 388 L500 396 L490 390 Z" fill="#3f8ee0"/>
    <path d="M495 380 L503 378 L505 384 L498 386 Z" fill="#e4f0fa"/>
  </g>
</svg>
