<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Source for musecade/assets/montecristo-keyart.png (pixelize.html, palette "montecristo"). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a1c"/>
      <stop offset=".55" stop-color="#16244a"/>
      <stop offset="1" stop-color="#2c4a7a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3462"/>
      <stop offset="1" stop-color="#070c1e"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4f2e6"/>
      <stop offset=".55" stop-color="#d8dcea"/>
      <stop offset=".8" stop-color="#8a9cc8" stop-opacity=".4"/>
      <stop offset="1" stop-color="#16244a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset=".35" stop-color="#ffc840" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c07a10" stop-opacity="0"/>
    </radialGradient>
    <filter id="b12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b5" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <g fill="#f4f2e6"><rect x="70" y="50" width="3" height="3"/><rect x="200" y="30" width="3" height="3"/><rect x="330" y="80" width="2" height="2"/><rect x="470" y="40" width="3" height="3"/><rect x="760" y="90" width="3" height="3"/><rect x="130" y="140" width="2" height="2"/><rect x="420" y="150" width="2" height="2"/></g>
  <!-- moon, upper left -->
  <circle cx="250" cy="130" r="130" fill="url(#moon)" filter="url(#b12)" opacity=".6"/>
  <circle cx="250" cy="130" r="56" fill="#ece8d8"/>
  <circle cx="232" cy="118" r="10" fill="#cfd2dc"/><circle cx="268" cy="146" r="7" fill="#cfd2dc"/>

  <!-- sea -->
  <rect x="0" y="330" width="800" height="270" fill="url(#sea)"/>
  <!-- moon path on the water -->
  <g fill="#d8dcea" opacity=".75"><rect x="210" y="342" width="80" height="3"/><rect x="200" y="360" width="100" height="3"/><rect x="220" y="378" width="60" height="3"/><rect x="196" y="398" width="110" height="3"/><rect x="214" y="420" width="74" height="3"/><rect x="230" y="444" width="40" height="3"/><rect x="204" y="470" width="90" height="3"/></g>
  <!-- waves -->
  <g fill="#3a5a92" opacity=".7"><rect x="40" y="380" width="40" height="3"/><rect x="380" y="372" width="50" height="3"/><rect x="100" y="450" width="60" height="3"/><rect x="420" y="430" width="44" height="3"/><rect x="60" y="520" width="70" height="3"/><rect x="350" y="510" width="60" height="3"/></g>

  <!-- the Château d'If on its rock, mid-distance -->
  <g>
    <path d="M300 340 L330 300 L460 296 L500 340 Z" fill="#1a1a26"/>
    <rect x="340" y="250" width="110" height="52" fill="#3a3c4e"/>
    <rect x="336" y="244" width="118" height="8" fill="#2a2c3a"/>
    <g fill="#3a3c4e"><rect x="336" y="236" width="10" height="8"/><rect x="356" y="236" width="10" height="8"/><rect x="376" y="236" width="10" height="8"/><rect x="396" y="236" width="10" height="8"/><rect x="416" y="236" width="10" height="8"/><rect x="436" y="236" width="10" height="8"/></g>
    <!-- round towers -->
    <rect x="322" y="230" width="30" height="72" fill="#4a4c60"/><rect x="318" y="222" width="38" height="10" fill="#2a2c3a"/>
    <rect x="440" y="226" width="30" height="76" fill="#4a4c60"/><rect x="436" y="218" width="38" height="10" fill="#2a2c3a"/>
    <!-- one tiny lit window -->
    <rect x="392" y="270" width="6" height="8" fill="#ffc840"/>
    <g fill="#14141e"><rect x="356" y="272" width="4" height="8"/><rect x="420" y="272" width="4" height="8"/></g>
  </g>

  <!-- foreground cliff, right -->
  <path d="M470 600 L520 430 L560 400 L640 386 L720 392 L800 380 L800 600 Z" fill="#0e0c14"/>
  <path d="M520 430 L560 400 L640 386 L720 392 L800 380" stroke="#2a2c3a" stroke-width="4" fill="none"/>
  <!-- myrtle bushes -->
  <g fill="#122a1e"><circle cx="760" cy="384" r="20"/><circle cx="540" cy="420" r="14"/></g>

  <!-- the open treasure chest, glowing -->
  <circle cx="610" cy="370" r="80" fill="url(#gold)" filter="url(#b12)"/>
  <g>
    <rect x="578" y="364" width="64" height="30" fill="#5a3418"/>
    <rect x="578" y="364" width="64" height="5" fill="#c07a10"/><rect x="606" y="364" width="8" height="30" fill="#c07a10"/>
    <path d="M578 364 L586 334 L650 334 L642 364 Z" fill="#6a4020"/>
    <rect x="586" y="334" width="64" height="5" fill="#c07a10"/>
    <!-- spilling gold and jewels -->
    <g fill="#ffd84a"><rect x="584" y="356" width="50" height="10"/><rect x="590" y="350" width="36" height="8"/><rect x="560" y="390" width="10" height="5"/><rect x="646" y="388" width="8" height="5"/><rect x="570" y="384" width="6" height="4"/></g>
    <g><rect x="598" y="352" width="6" height="6" fill="#e0304a"/><rect x="616" y="350" width="6" height="6" fill="#2ab070"/><rect x="608" y="356" width="5" height="5" fill="#f4f2e6"/><rect x="652" y="384" width="5" height="5" fill="#e0304a"/></g>
  </g>

  <!-- THE COUNT, cloaked, on the cliff edge, looking toward the fortress -->
  <g>
    <!-- cloak -->
    <path d="M664 388 L672 290 Q690 268 708 290 L722 388 L700 380 L690 392 L680 380 Z" fill="#06060c"/>
    <!-- cloak edge catching moonlight -->
    <path d="M672 290 L664 388" stroke="#3a4a7a" stroke-width="3"/>
    <!-- head -->
    <circle cx="690" cy="270" r="15" fill="#d8c8b8"/>
    <path d="M675 268 Q676 252 690 251 Q705 252 706 268 L700 262 L690 260 L680 262 Z" fill="#0a0a12"/>
    <!-- face turned left, toward the fortress: a dark eye -->
    <rect x="680" y="268" width="4" height="3" fill="#0a0a12"/>
    <!-- collar -->
    <path d="M676 284 L690 292 L704 284 L704 292 L690 300 L676 292 Z" fill="#14141e"/>
    <!-- gold light on his left side -->
    <path d="M664 330 L668 290 L674 292 L670 380 Z" fill="#c07a10" opacity=".55"/>
  </g>

  <!-- a distant white sail -->
  <path d="M120 330 L132 296 L144 330 Z" fill="#e8e4d4"/><rect x="118" y="330" width="28" height="5" fill="#3a2a1a"/>
</svg>
