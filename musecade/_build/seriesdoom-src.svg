<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Source for musecade/assets/seriesdoom-keyart.png (pixelize.html, palette "seriesdoom"). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#130f2a"/>
      <stop offset=".3" stop-color="#3a2a6e"/>
      <stop offset=".5" stop-color="#ff4fa3"/>
      <stop offset=".62" stop-color="#ff8a3d"/>
      <stop offset=".7" stop-color="#ffe08a"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f86b0"/>
      <stop offset="1" stop-color="#1a2a44"/>
    </linearGradient>
    <radialGradient id="fire" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".4" stop-color="#ff8a3d" stop-opacity=".8"/>
      <stop offset="1" stop-color="#c0362c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4f4f8"/>
      <stop offset=".3" stop-color="#9ff6ff" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#ff9ed0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8a5fd0" stop-opacity="0"/>
    </radialGradient>
    <filter id="b8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#f4f4f8"><rect x="80" y="40" width="2" height="2"/><rect x="220" y="80" width="2" height="2"/><rect x="400" y="30" width="2" height="2"/><rect x="560" y="60" width="2" height="2"/><rect x="700" y="36" width="2" height="2"/><rect x="330" y="110" width="2" height="2"/></g>

  <!-- Mount Diablo far right, with the Crucible flaming on the summit -->
  <path d="M430 330 L560 250 L610 218 L640 230 L700 262 L800 300 L800 340 Z" fill="#3a2a6e"/>
  <path d="M560 250 L610 218 L640 230" stroke="#ffb65c" stroke-width="2" fill="none"/>
  <circle cx="614" cy="198" r="44" fill="url(#fire)" filter="url(#b8)"/>
  <path d="M606 218 L610 176 L614 196 L620 168 L624 218 Z" fill="#ff8a3d"/>
  <path d="M609 218 L613 190 L617 204 L620 218 Z" fill="#ffe08a"/>
  <rect x="604" y="214" width="22" height="6" fill="#1d1d22"/>

  <!-- the bay -->
  <rect y="330" width="800" height="110" fill="url(#bay)"/>
  <g fill="#ff9ed0" opacity=".6"><rect x="80" y="344" width="70" height="3"/><rect x="480" y="360" width="90" height="3"/><rect x="600" y="340" width="40" height="2"/></g>

  <!-- the city skyline (left-center), with a tower crowned by a glowing eye -->
  <path d="M170 330 L170 280 L190 280 L190 250 L206 250 L206 290 L226 290 L226 214 L250 200 L274 214 L274 300 L300 300 L300 262 L322 262 L322 240 L338 240 L338 306 L370 306 L370 276 L392 276 L392 330 Z" fill="#221a47"/>
  <g fill="#ffe08a"><rect x="232" y="226" width="3" height="3"/><rect x="244" y="240" width="3" height="3"/><rect x="258" y="256" width="3" height="3"/><rect x="306" y="276" width="3" height="3"/><rect x="326" y="252" width="3" height="3"/><rect x="376" y="290" width="3" height="3"/><rect x="196" y="262" width="3" height="3"/></g>
  <ellipse cx="250" cy="196" rx="16" ry="8" fill="#2ee6ff" opacity=".35" filter="url(#b8)"/>
  <ellipse cx="250" cy="196" rx="9" ry="5" fill="#9ff6ff"/>
  <circle cx="250" cy="196" r="3" fill="#c0362c"/>

  <!-- the Golden Gate bridge (left) in fog -->
  <g fill="#c0362c">
    <rect x="30" y="216" width="8" height="120"/><rect x="118" y="216" width="8" height="120"/>
    <rect x="28" y="226" width="12" height="4"/><rect x="116" y="226" width="12" height="4"/>
    <rect x="0" y="318" width="170" height="6"/>
  </g>
  <path d="M-10 318 C10 290 30 230 34 222 C60 290 100 290 122 222 C130 250 150 300 175 318" stroke="#e05a2a" stroke-width="2" fill="none"/>
  <g filter="url(#b8)" opacity=".75"><ellipse cx="80" cy="330" rx="140" ry="18" fill="#a9c4de"/><ellipse cx="260" cy="340" rx="120" ry="12" fill="#a9c4de"/></g>

  <!-- foreground hill (Twin Peaks-ish) -->
  <path d="M0 600 L0 470 C120 430 260 420 400 440 C520 456 640 470 800 450 L800 600 Z" fill="#130f2a"/>
  <path d="M0 470 C120 430 260 420 400 440 C520 456 640 470 800 450" stroke="#8a5fd0" stroke-width="2" fill="none"/>

  <!-- the Vests: a line of e-scooter silhouettes on the ridge -->
  <g fill="#07060f">
    <g transform="translate(560 432)"><rect x="0" y="0" width="8" height="18"/><rect x="-2" y="-6" width="12" height="7"/><rect x="-6" y="18" width="22" height="3"/><rect x="14" y="4" width="2" height="16"/></g>
    <g transform="translate(600 436)"><rect x="0" y="0" width="8" height="18"/><rect x="-2" y="-6" width="12" height="7"/><rect x="-6" y="18" width="22" height="3"/><rect x="14" y="4" width="2" height="16"/></g>
    <g transform="translate(640 440)"><rect x="0" y="0" width="8" height="18"/><rect x="-2" y="-6" width="12" height="7"/><rect x="-6" y="18" width="22" height="3"/><rect x="14" y="4" width="2" height="16"/></g>
    <g transform="translate(680 438)"><rect x="0" y="0" width="8" height="18"/><rect x="-2" y="-6" width="12" height="7"/><rect x="-6" y="18" width="22" height="3"/><rect x="14" y="4" width="2" height="16"/></g>
  </g>
  <g fill="#2ee6ff"><rect x="558" y="452" width="4" height="2"/><rect x="598" y="456" width="4" height="2"/><rect x="638" y="460" width="4" height="2"/><rect x="678" y="458" width="4" height="2"/></g>

  <!-- the two founders, one holding up the glowing disc -->
  <g transform="translate(300 438)">
    <ellipse cx="30" cy="66" rx="50" ry="6" fill="#07060f" opacity=".6"/>
    <!-- founder 1 (hoodie) arm raised -->
    <rect x="0" y="10" width="20" height="30" fill="#5b3f9a"/>
    <rect x="2" y="40" width="7" height="24" fill="#1d1d22"/><rect x="11" y="40" width="7" height="24" fill="#1d1d22"/>
    <rect x="3" y="-4" width="14" height="14" fill="#e6cf7a"/>
    <rect x="1" y="-6" width="18" height="6" fill="#3a2a6e"/>
    <rect x="18" y="-18" width="6" height="30" fill="#5b3f9a"/>
    <!-- founder 2 (glasses, backpack) -->
    <rect x="36" y="14" width="20" height="28" fill="#2f4d73"/>
    <rect x="52" y="16" width="10" height="20" fill="#e05a2a"/>
    <rect x="38" y="42" width="7" height="22" fill="#1d1d22"/><rect x="47" y="42" width="7" height="22" fill="#1d1d22"/>
    <rect x="39" y="0" width="14" height="14" fill="#6b5a2a"/>
    <rect x="40" y="5" width="5" height="3" fill="#f4f4f8"/><rect x="47" y="5" width="5" height="3" fill="#f4f4f8"/>
  </g>
  <circle cx="321" cy="410" r="40" fill="url(#disc)"/>
  <circle cx="321" cy="410" r="10" fill="#b4b4c0"/>
  <circle cx="321" cy="410" r="8" fill="#9ff6ff"/>
  <circle cx="321" cy="410" r="2" fill="#130f2a"/>
</svg>
